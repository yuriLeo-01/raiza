[package]
name = "raizad"
description = "Daemon do Raiza: registra provedores, funde dispositivos e expõe a API D-Bus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
raiza-core = { workspace = true, features = ["dbus", "mock"] }
raiza-provider-bluez = { path = "../raiza-provider-bluez" }
raiza-provider-hid = { path = "../raiza-provider-hid" }
raiza-provider-pipewire = { path = "../raiza-provider-pipewire" }
raiza-provider-udev = { path = "../raiza-provider-udev" }
anyhow = "1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
async-trait = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
# Conexão ponto a ponto nos testes de integração.
zbus = { version = "5", default-features = false, features = ["tokio", "p2p"] }
