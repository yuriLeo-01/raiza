[package]
name = "raiza-ctl"
description = "CLI do Raiza: lista, consulta, altera e acompanha dispositivos pelo daemon raizad"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
raiza-core = { workspace = true, features = ["dbus"] }
raiza-i18n.workspace = true
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
# Os recursos padrão (`std`) também são exigidos pelo `raiza-core` com a feature `dbus`.
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
# Servidor D-Bus falso, ponto a ponto, nos testes ponta a ponta.
tokio = { version = "1", features = ["macros", "rt", "net"] }
zbus = { version = "5", default-features = false, features = ["tokio", "p2p"] }
