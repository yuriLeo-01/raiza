[package]
name = "raiza-core"
description = "Tipos e contratos compartilhados do Raiza (dispositivos, capacidades, provedores)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# `MockProvider` para testes de outros crates.
mock = ["dep:futures-channel"]

[dependencies]
async-trait = "0.1"
futures-core = "0.3"
futures-channel = { version = "0.3", optional = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
futures = "0.3"
futures-channel = "0.3"
serde_json = "1"
