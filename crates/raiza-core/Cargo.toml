[package]
name = "raiza-core"
description = "Tipos e contratos compartilhados do Raiza (dispositivos, capacidades, provedores)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# `MockProvider` para testes de outros crates.
mock = ["dep:futures-channel"]
# Proxy D-Bus do cliente e erros nomeados (docs/DBUS.md).
dbus = ["dep:zbus", "dep:serde_json", "dep:futures-util"]

[dependencies]
async-trait = "0.1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["alloc"], optional = true }
futures-channel = { version = "0.3", optional = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
zbus = { version = "5", default-features = false, features = ["tokio"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
futures = "0.3"
futures-channel = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net"] }
# Conexão ponto a ponto nos testes do fio D-Bus.
zbus = { version = "5", default-features = false, features = ["tokio", "p2p"] }
