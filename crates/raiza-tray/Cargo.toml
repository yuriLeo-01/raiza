[package]
name = "raiza-tray"
description = "Ícone de bandeja (StatusNotifierItem) do Raiza com a bateria dos periféricos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
raiza-core = { workspace = true, features = ["dbus"] }
anyhow = "1"
futures-util = "0.3"
# 0.3.8 saiu em 2026-11-26; fixada na 0.3.7 (2026-10-20) até ter duas semanas.
ksni = { version = "=0.3.7", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["macros", "rt", "process", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
