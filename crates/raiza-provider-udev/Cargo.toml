[package]
name = "raiza-provider-udev"
description = "Provedor udev do Raiza: descoberta e hotplug de periféricos USB e Bluetooth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
raiza-core = { workspace = true }
async-trait = "0.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time"] }
tracing = "0.1"
# `send` torna o monitor `Send`, para viver dentro do fluxo de eventos.
udev = { version = "0.9", features = ["send"] }

[dev-dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
