[package]
name = "raiza-gtk"
description = "Interface GTK4/libadwaita do Raiza"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
raiza-core = { workspace = true, features = ["dbus"] }
futures-util = "0.3"
# `gnome_46` = GTK 4.14 e libadwaita 1.5, o que o Ubuntu 24.04 (CI) oferece.
relm4 = { version = "0.10", default-features = false, features = ["macros", "libadwaita", "gnome_46"] }
tokio = { version = "1", features = ["macros", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
